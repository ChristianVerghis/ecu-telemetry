name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  firmware:
    name: firmware (cmake + ctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware -B firmware/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build firmware/build --parallel
      - name: Unit tests
        run: ctest --test-dir firmware/build --output-on-failure
      - name: Smoke-run agent
        run: firmware/build/ecu_agent --id ECU-CI --duration 2 --hz 5 --udp-port 18781 --tcp-port 18782 || test $? -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: ecu_agent-linux-amd64
          path: firmware/build/ecu_agent
          if-no-files-found: error
          retention-days: 7

  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Test
        working-directory: backend
        run: python -m pytest -q tests

  integration:
    name: integration (agent + backend)
    needs: [firmware, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ecu_agent-linux-amd64
          path: firmware/build
      - run: chmod +x firmware/build/ecu_agent
      - name: Run integration tests
        env:
          ECU_AGENT: ${{ github.workspace }}/firmware/build/ecu_agent
        run: python -m pytest -q -rs tests/integration

  sil:
    name: sil (${{ matrix.scenario }})
    needs: [firmware, backend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [baseline_fleet, thermal_runaway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ecu_agent-linux-amd64
          path: firmware/build
      - run: chmod +x firmware/build/ecu_agent
      - name: Validate all scenarios
        run: python sim/run_sil.py --validate sim/scenarios/*.yml
      - name: Run scenario
        run: python sim/run_sil.py sim/scenarios/${{ matrix.scenario }}.yml --start-backend --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sil-report-${{ matrix.scenario }}
          path: sim/reports/
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose --profile chaos config -q
      - name: Build images
        run: docker compose --profile chaos build
